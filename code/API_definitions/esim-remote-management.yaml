paths:
  /download:
    post:
      security:
        - openId:
            - esim-remote-management:download-profile
      tags:
        - Esim Remote Management
      summary: Download profile
      description: |
        Download and optionally install a new eSIM profile to the device. This is an asynchronous operation that returns a task ID for status tracking.

        If the optional `sink` is provided in the request body, the API provider
        notifies the API consumer of the operation outcome via that sink;
        otherwise the outcome is retrieved with `/result/query`.
      parameters:
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
      operationId: profileDownload
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileOperationRequest'
        required: true
      responses:
        "201":
          description: OK
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
            Location:
              description: |
                URL of the task resource for retrieving the result of this operation. The URL follows the pattern `/result/query?taskId={taskId}`.
              schema:
                type: string
                format: uri-reference
                maxLength: 2048
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileOperationResult'
        '400':
          $ref: "../common/CAMARA_common.yaml#/components/responses/BadRequest400"
        '401':
          $ref: "../common/CAMARA_common.yaml#/components/responses/Unauthenticated401"
        '403':
          $ref: "../common/CAMARA_common.yaml#/components/responses/PermissionDenied403"
        '404':
          $ref: "../common/CAMARA_common.yaml#/components/responses/IdentifierNotFound404"
        '422':
          $ref: "#/components/responses/UnprocessableEntity422"
        '429':
          $ref: "../common/CAMARA_common.yaml#/components/responses/TooManyRequests429"
      callbacks:
        profile-download-completed:
          "{$request.body#/sink}":
            post:
              parameters:
                - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
              requestBody:
                content:
                  application/cloudevents+json:
                    schema:
                      $ref: '#/components/schemas/ProfileOperationCallback'
              responses:
                "204":
                  description: Successful notification
                  headers:
                    x-correlator:
                      $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
                "400":
                  $ref: "../common/CAMARA_common.yaml#/components/responses/BadRequest400"
                "401":
                  $ref: "../common/CAMARA_common.yaml#/components/responses/Unauthenticated401"
                "403":
                  $ref: "../common/CAMARA_common.yaml#/components/responses/PermissionDenied403"
                "410":
                  $ref: "../common/CAMARA_event_common.yaml#/components/responses/SinkGone410"
                "429":
                  $ref: "../common/CAMARA_common.yaml#/components/responses/TooManyRequests429"
              security:
                - {}
                - notificationsBearerAuth: []
  /result/query:
    post:
      security:
        - openId:
            - esim-remote-management:query-result
      tags:
        - Esim Remote Management
      summary: Query profile operation result
      description: |
        Query the result of an profile operation using the task ID returned from a operation request.
      parameters:
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
      operationId: profileResultQuery
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileResultQueryRequest'
        required: true
      responses:
        "200":
          description: OK
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileOperationResult'
        '400':
          $ref: "../common/CAMARA_common.yaml#/components/responses/BadRequest400"
        '401':
          $ref: "../common/CAMARA_common.yaml#/components/responses/Unauthenticated401"
        '403':
          $ref: "../common/CAMARA_common.yaml#/components/responses/PermissionDenied403"
        '404':
          $ref: "../common/CAMARA_common.yaml#/components/responses/NotFound404"
        '429':
          $ref: "../common/CAMARA_common.yaml#/components/responses/TooManyRequests429"
