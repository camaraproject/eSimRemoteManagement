servers:
  - url: "{apiRoot}/esim-remote-management/vwip"
    variables:
      apiRoot:
        default: http://localhost:9091
        description: API root, defined by the service provider, e.g. `api.example.com` or `api.example.com/somepath`
tags:
  - name: Esim Remote Management
    description: API operations for Esim Remote Management
paths:
  /download:
    post:
      security:
        - openId:
            - esim-remote-management:download
      tags:
        - Esim Remote Management
      summary: Download profile
      description: |
        Download and optionally install a new eSIM profile to the device. This is an asynchronous operation that returns a task ID for status tracking.

        If the optional `sink` is provided in the request body, the API provider
        notifies the API consumer of the operation outcome via that sink;
        otherwise the outcome is retrieved with `/result/query`.
      parameters:
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
      operationId: profileDownload
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaseCmpReqProfileDownloadReq'
        required: true
      responses:
        "201":
          description: OK
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseCmpRespProfileDownloadResp'
        '400':
          $ref: "../common/CAMARA_common.yaml#/components/responses/BadRequestWithRange400"
        '401':
          $ref: "../common/CAMARA_common.yaml#/components/responses/Unauthenticated401"
        '403':
          $ref: "#/components/responses/PermissionDenied403"
        '404':
          $ref: "#/components/responses/NotFound404"
        '422':
          $ref: "#/components/responses/ProfileOperationUnprocessableEntity422"
      callbacks:
        profile-download-completed:
          "{$request.body#/sink}":
            post:
              parameters:
                - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
              requestBody:
                content:
                  application/cloudevents+json:
                    schema:
                      $ref: '#/components/schemas/ProfileOperationCallback'
              responses:
                "204":
                  description: Successful notification
                  headers:
                    x-correlator:
                      $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
                "400":
                  $ref: "../common/CAMARA_common.yaml#/components/responses/BadRequestWithRange400"
                "401":
                  $ref: "../common/CAMARA_common.yaml#/components/responses/Unauthenticated401"
                "403":
                  $ref: "#/components/responses/PermissionDenied403"
                "410":
                  $ref: "../common/CAMARA_event_common.yaml#/components/responses/SinkGone410"
                "429":
                  $ref: "#/components/responses/TooManyRequests429"
              security:
                - {}
                - notificationsBearerAuth: []
  /result/query:
    post:
      security:
        - openId:
            - esim-remote-management:query
      tags:
        - Esim Remote Management
      summary: Query profile operation result
      description: |
        Query the result of an profile operation using the task ID returned from a operation request.
      parameters:
        - $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"
      operationId: profileResultQuery
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaseCmpReqProfileResultQueryReq'
        required: true
      responses:
        "200":
          description: OK
          headers:
            x-correlator:
              $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseCmpRespProfileResultQueryResp'
        '400':
          $ref: "../common/CAMARA_common.yaml#/components/responses/BadRequestWithRange400"
        '401':
          $ref: "../common/CAMARA_common.yaml#/components/responses/Unauthenticated401"
        '403':
          $ref: "#/components/responses/PermissionDenied403"
        '404':
          $ref: "#/components/responses/NotFound404"
        '422':
          $ref: "../common/CAMARA_common.yaml#/components/responses/DeviceIdentifier422"
  /enable-profile:
    post:
      security:
        - openId:
            - esim-remote-management:enable-profile
      tags:
        - Esim Remote Management
      summary: Enable a profile
      description: |
        Enable an eSIM profile. This is an asynchronous operation that returns a task ID for status tracking.

        If the optional `sink` is provided in the request body, the API provider
