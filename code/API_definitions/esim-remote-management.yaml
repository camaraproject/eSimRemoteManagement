    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: '{apiRoot}/esim-remote-management/v0.1alpha1'
    variables:
      apiRoot:
        default: http://localhost:9091
        description: API root, defined by the service provider, e.g. `api.example.com` or `api.example.com/somepath`
tags:
  - name: Esim Remote Management
    description: API operations for Esim Remote Management
externalDocs:
  description: Product documentation at CAMARA
  url: https://github.com/camaraproject/eSimRemoteManagement
paths:
  /download:
    post:
      security:
        - openId:
            - esim-remote-management:download-profile
      tags:
        - Esim Remote Management
      summary: Download profile
      description: |
        Download the eSIM profile identified by `device.iccid` to the eUICC
        identified by `device.eId`. This is an asynchronous operation that
        returns a task ID for status tracking.

        The profile is downloaded in the `downloaded` state. It becomes
        `enabled` only through a separate `enable` operation.

        If the optional `sink` is provided in the request body, the API provider
        notifies the API consumer of the operation outcome via that sink;
        otherwise the outcome is retrieved with `/result/query`.
      parameters:
        - $ref: '#/components/parameters/x-correlator'
      operationId: profileDownload
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileOperationRequest'
        required: true
      responses:
        '201':
          description: OK
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
            Location:
              description: |
                URL of the task resource for retrieving the result of this operation. The URL follows the pattern `/result/query?taskId={taskId}`.
              schema:
                type: string
                format: uri-reference
                maxLength: 2048
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileOperationResult'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthenticated401'
        '403':
          $ref: '#/components/responses/PermissionDenied403'
        '404':
          $ref: '#/components/responses/IdentifierNotFound404'
        '422':
          $ref: '#/components/responses/UnprocessableEntity422'
        '429':
          $ref: '#/components/responses/TooManyRequests429'
      callbacks:
        profile-download-completed:
          '{$request.body#/sink}':
            post:
              parameters:
                - $ref: '#/components/parameters/x-correlator'
              requestBody:
                content:
                  application/cloudevents+json:
                    schema:
                      $ref: '#/components/schemas/ProfileOperationCallback'
              responses:
                '204':
                  description: Successful notification
                  headers:
                    x-correlator:
                      $ref: '#/components/headers/x-correlator'
                '400':
                  $ref: '#/components/responses/BadRequest400'
                '401':
                  $ref: '#/components/responses/Unauthenticated401'
                '403':
                  $ref: '#/components/responses/PermissionDenied403'
                '410':
                  $ref: '#/components/responses/SinkGone410'
                '429':
                  $ref: '#/components/responses/TooManyRequests429'
              security:
                - {}
                - notificationsBearerAuth: []
  /result/query:
    post:
      security:
        - openId:
            - esim-remote-management:query-result
      tags:
        - Esim Remote Management
      summary: Query profile operation result
      description: |
        Query the result of an profile operation using the task ID returned from a operation request.
      parameters:
        - $ref: '#/components/parameters/x-correlator'
      operationId: profileResultQuery
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileResultQueryRequest'
        required: true
      responses:
        '200':
          description: OK
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileOperationResult'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthenticated401'
        '403':
          $ref: '#/components/responses/PermissionDenied403'
        '404':
          $ref: '#/components/responses/NotFound404'
        '429':
          $ref: '#/components/responses/TooManyRequests429'
  /enable-profile:
    post:
      security:
        - openId:
            - esim-remote-management:enable-profile
      tags:
        - Esim Remote Management
      summary: Enable a profile
      description: |
        Enable an eSIM profile. This is an asynchronous operation that returns a task ID for status tracking.

        If the optional `sink` is provided in the request body, the API provider
        notifies the API consumer of the operation outcome via that sink;
        otherwise the outcome is retrieved with `/result/query`.
      parameters:
        - $ref: '#/components/parameters/x-correlator'
      operationId: profileEnable
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileOperationRequest'
        required: true
      responses:
        '201':
          description: OK
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
            Location:
              description: |
                URL of the task resource for retrieving the result of this operation. The URL follows the pattern `/result/query?taskId={taskId}`.
              schema:
                type: string
                format: uri-reference
                maxLength: 2048
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileOperationResult'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthenticated401'
        '403':
          $ref: '#/components/responses/PermissionDenied403'
        '404':
          $ref: '#/components/responses/IdentifierNotFound404'
        '422':
          $ref: '#/components/responses/UnprocessableEntity422'
        '429':
          $ref: '#/components/responses/TooManyRequests429'
      callbacks:
        profile-operation-completed:
          '{$request.body#/sink}':
            post:
              parameters:
                - $ref: '#/components/parameters/x-correlator'
              requestBody:
                content:
                  application/cloudevents+json:
                    schema:
                      $ref: '#/components/schemas/ProfileOperationCallback'
              responses:
                '204':
                  description: Successful notification
                  headers:
                    x-correlator:
                      $ref: '#/components/headers/x-correlator'
                '400':
                  $ref: '#/components/responses/BadRequest400'
                '401':
                  $ref: '#/components/responses/Unauthenticated401'
                '403':
                  $ref: '#/components/responses/PermissionDenied403'
                '410':
                  $ref: '#/components/responses/SinkGone410'
                '429':
                  $ref: '#/components/responses/TooManyRequests429'
              security:
                - {}
                - notificationsBearerAuth: []
  /disable-profile:
    post:
      security:
        - openId:
            - esim-remote-management:disable-profile
      tags:
        - Esim Remote Management
      summary: Disable a profile
      description: |
        Disable an eSIM profile. This is an asynchronous operation that returns a task ID for status tracking.

        If the optional `sink` is provided in the request body, the API provider
        notifies the API consumer of the operation outcome via that sink;
