openapi: 3.0.3
info:
  title: Esim Remote Management
  description: |
    Provide eSIM-based remote management capability, allowing users to remotely manage the status of profiles on the device's eUICC and complete remote operations such as downloading, activating, de-activating or deleting.

    # Introduction

    The eIM Platform API provides a comprehensive, secure, and standardized interface for device manufacturers (OEMs) and ecosystem partners to remotely manage eSIM profiles on connected devices. This API empowers you to offer seamless connectivity lifecycle management directly within your device ecosystem.

    # API Functionality

    The API provides the following functionality:
      - Download profiles: Download and optionally install a new eSIM profile to the device. This is an asynchronous operation that returns a task ID for status tracking.
      - Profile Lifecycle Management: Execute precise control over installed profiles:
        - Enable: Switch a downloaded profile to the active state for live connectivity.
        - Disable: Temporarily disable a profile without deleting it from the device.
        - Deletion: Permanently remove an unused or obsolete profile from the device's eSIM chip, freeing up memory.
      - Query the operation result: Query the result of a profile operation using the task ID returned from an operation request.

    # Profile lifecycle

    A profile on an eUICC goes through the following states. Each transition is
    triggered by one of the operations of this API:

        downloaded --enable--> enabled --disable--> disabled
        enabled / disabled --delete--> deleted

    A profile is `downloaded` onto the eUICC by the `download` operation. It
    becomes `enabled` when the profile is activated for connectivity, either
    through the `enable` operation or, if the API provider supports it, as
    part of the download itself. A `disabled` profile is still installed on
    the eUICC and can be enabled again; a `deleted` profile is removed from
    the eUICC and cannot be restored.

    # Identifying the target of an operation

    Every profile operation acts on one specific profile of one specific
    eUICC, and both are always stated in the request body:

    - `device.eId` — the EID of the eUICC that holds the profile. The EID is
      the hardware identifier of the eUICC and is reported by the device
      manufacturer or by the eUICC vendor.
    - `device.iccid` — the ICCID of the profile to act on. The ICCID is the
      identifier of the profile itself and is assigned when the profile is
      created; the API provider reports it once the profile is available on
      the eUICC.
    - `device.imei` — the IMEI of the device. This one is optional and is
      provided as additional information; it is not needed to determine the
      target of an operation.

    The two required identifiers are not interchangeable: the EID says which
    eUICC to act on, and the ICCID says which profile on that eUICC to act
    on. An operation that omits either of them is rejected with
    `400 INVALID_ARGUMENT`.

    The following scopes are required:
      - esim-remote-management:download-profile - Download and install a new profile
      - esim-remote-management:enable-profile - Enable a downloaded profile
      - esim-remote-management:disable-profile - Disable an enabled profile
      - esim-remote-management:delete-profile - Delete a profile from the device
      - esim-remote-management:query-result - Query the result of an asynchronous operation

    <!-- CAMARA:MANDATORY:authorization-and-authentication:BEGIN -->

    # Authorization and authentication

    The "Camara Security and Interoperability Profile" provides details of how an API consumer requests an access token. Please refer to Identity and Consent Management (https://github.com/camaraproject/IdentityAndConsentManagement/) for the released version of the profile.

    The specific authorization flows to be used will be agreed upon during the onboarding process, happening between the API consumer and the API provider, taking into account the declared purpose for accessing the API, whilst also being subject to the prevailing legal framework dictated by local legislation.

    In cases where personal data is processed by the API and users can exercise their rights through mechanisms such as opt-in and/or opt-out, the use of three-legged access tokens is mandatory. This ensures that the API remains in compliance with privacy regulations, upholding the principles of transparency and user-centric privacy-by-design.
    <!-- CAMARA:MANDATORY:authorization-and-authentication:END -->

    <!-- CAMARA:MANDATORY:additional-error-responses:BEGIN -->

    # Additional CAMARA error responses

    The list of error codes in this API specification is not exhaustive. Therefore the API specification MAY not document some non-mandatory error statuses as indicated in `CAMARA API Design Guide`.

    Please refer to the `CAMARA_common.yaml` of the Commonalities Release associated to this API version for a complete list of error responses. The applicable Commonalities Release can be identified from the `x-camara-commonalities` field, the changelog and the metadata of the released API version.

    As a specific rule, error `501 - NOT_IMPLEMENTED` can be only a possible error response if it is explicitly documented in the API.
    <!-- CAMARA:MANDATORY:additional-error-responses:END -->

    <!-- CAMARA:MANDATORY:request-body-strictness:BEGIN -->

    # Request body strictness

    This API rejects requests with JSON request bodies that contain properties not declared in this specification, at any nesting level. Unknown properties result in a `400 INVALID_ARGUMENT` response.
    <!-- CAMARA:MANDATORY:request-body-strictness:END -->

