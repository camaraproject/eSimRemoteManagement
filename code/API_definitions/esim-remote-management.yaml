components:
  securitySchemes:
    openId:
      $ref: "../common/CAMARA_common.yaml#/components/securitySchemes/openId"
    notificationsBearerAuth:
      $ref: "../common/CAMARA_event_common.yaml#/components/securitySchemes/notificationsBearerAuth"

  schemas:
    BaseCmpReqProfileResultQueryReq:
      type: object
      description: Request body for querying profile operation result
      required:
        - taskId
      properties:
        taskId:
          $ref: '#/components/schemas/ProfileOpertaskid'
        device:
          $ref: '#/components/schemas/ProfileOperDevice'
    BaseCmpRespProfileResultQueryResp:
      type: object
      description: Callback payload for profile operation completion notification
      properties:
        taskId:
          type: string
          pattern: "^[a-zA-Z0-9\\-]{1,64}$"
          maxLength: 64
          description: Task identifier
        eId:
          type: string
          pattern: "^[a-zA-Z0-9\\-]{1,64}$"
          maxLength: 64
          description: Device EID (eUICC Identifier)
        imei:
          type: string
          pattern: "^[0-9]{15}$"
          maxLength: 32
          description: Device IMEI number
        iccid:
          type: string
          pattern: "^[0-9]{19,20}$"
          maxLength: 32
          description: Card ICCID number
        operResult:
          type: string
          description: Operation profile result
          enum:
            - SUCCESS
            - ERROR
    BaseCmpReqProfileOperReq:
      type: object
      description: Request body for profile operation
      required:
        - device
      properties:
        device:
          $ref: '#/components/schemas/ProfileOperDevice'
        sink:
          description: |
            The URL where notifications about the outcome of this operation are
            delivered, using the CloudEvents format over HTTP.

            Providing `sink` requests event-notification delivery for this
            operation. If the API provider does not support notification
            delivery, the request MUST be rejected with
            `422 EVENT_NOTIFICATIONS_NOT_SUPPORTED` and the operation MUST NOT
            be started. The API consumer can then retry without `sink` and
            retrieve the outcome via `/result/query` instead.
          allOf:
            - $ref: "../common/CAMARA_event_common.yaml#/components/schemas/Sink"
        sinkCredential:
          $ref: "../common/CAMARA_event_common.yaml#/components/schemas/SinkCredential"
    BaseCmpRespProfileOperResp:
      type: object
      description: Response body for profile operation
      properties:
        taskId:
          $ref: '#/components/schemas/ProfileOpertaskid'
        device:
          $ref: '#/components/schemas/ProfileOperDevice'
        status:
          $ref: "#/components/schemas/ProfileOperStatus"
        statusInfo:
          $ref: "#/components/schemas/ProfileOperStatusInfo"
    ProfileOpertaskid:
      type: string
      pattern: "^[a-zA-Z0-9\\-]{1,64}$"
      maxLength: 64
      description: The task number returned after the operation is completed
    ProfileOperDevice:
      type: object
      description: Configuration for profile operation response
      properties:
        eId:
          type: string
          pattern: "^[a-zA-Z0-9\\-]{1,64}$"
          maxLength: 64
          description: Device EID
        imei:
          type: string
          pattern: "^[0-9]{15}$"
          maxLength: 32
          description: Device IMEI number
        iccid:
          type: string
          pattern: "^[0-9]{19,20}$"
          maxLength: 32
          description: Card ICCID number
    ProfileOperStatus:
      description: |
        Status of the profile operation
        * `SUCCESS` - The eSIM configuration file was successfully enabled
        * `ERROR` - Failed to enable the eSIM configuration file
      type: string
      enum:
        - SUCCESS
        - ERROR
    ProfileOperStatusInfo:
      description: |
        Additional information about the profile operation status
        * `OPERATION_COMPLETED` - The assignment operation has been completed
        * `ICCID_NOT_FOUND` - The specified iccid does not exist
        * `OPERATION_UNKNOWN_ERROR` - The operation failed due to an unknown error
        * `OPERATION_PENDING` - The operation request is pending for validation and verification
      type: string
      enum:
        - OPERATION_COMPLETED
        - ICCID_NOT_FOUND
        - OPERATION_UNKNOWN_ERROR
        - OPERATION_PENDING
    BaseCmpReqProfileDownloadReq:
      type: object
      description: Request body for profile operation
      required:
        - device
      properties:
        device:
          $ref: '#/components/schemas/ProfileOperDevice'
        sink:
          description: |
            The URL where notifications about the outcome of this operation are
            delivered, using the CloudEvents format over HTTP.

            Providing `sink` requests event-notification delivery for this
            operation. If the API provider does not support notification
            delivery, the request MUST be rejected with
            `422 EVENT_NOTIFICATIONS_NOT_SUPPORTED` and the operation MUST NOT
            be started. The API consumer can then retry without `sink` and
            retrieve the outcome via `/result/query` instead.
          allOf:
            - $ref: "../common/CAMARA_event_common.yaml#/components/schemas/Sink"
        sinkCredential:
          $ref: "../common/CAMARA_event_common.yaml#/components/schemas/SinkCredential"
    BaseCmpRespProfileDownloadResp:
      type: object
      description: Response body for profile operation
      properties:
        taskId:
          $ref: '#/components/schemas/ProfileOpertaskid'
        device:
          $ref: '#/components/schemas/ProfileOperDevice'
        status:
          $ref: "#/components/schemas/ProfileOperStatus"
        statusInfo:
          $ref: "#/components/schemas/ProfileOperStatusInfo"
    ProfileOperationCallback:
      description: Callback payload for profile operation completion notification
      allOf:
        - $ref: "#/components/schemas/ApiNotificationEvent"
        - type: object
          properties:
            data:
              type: object
              description: Event details
              properties:
                taskId:
                  type: string
                  pattern: "^[a-zA-Z0-9\\-]{1,64}$"
                  maxLength: 64
                  description: Task identifier
                eId:
                  type: string
                  pattern: "^[a-zA-Z0-9\\-]{1,64}$"
                  maxLength: 64
                  description: Device EID (eUICC Identifier)
                imei:
                  type: string
                  pattern: "^[0-9]{15}$"
                  maxLength: 32
                  description: Device IMEI number
                iccid:
                  type: string
                  pattern: "^[0-9]{19,20}$"
                  maxLength: 32
                  description: Card ICCID number
                operResult:
                  type: string
                  description: Operation profile result
                  enum:
                    - SUCCESS
                    - ERROR
              required:
                - taskId
    ApiEventType:
      type: string
      description: |
        Enum of API-specific event type strings for this API project.
        The reverse-DNS prefix `org.camaraproject.<api-name>` makes each value
        globally unique, so two different API groups can independently define
        identically-named event types without any collision risk.
      enum:
        - org.camaraproject.esim-remote-management.v0.profile-download-completed
        - org.camaraproject.esim-remote-management.v0.profile-operation-completed
    ApiNotificationEvent:
      description: |
        API-specific notification event group.
        Extends the CloudEvent envelope and constrains `type` to the set of
        event types defined by this API project.
        Adding a new event type only requires updating ApiEventType and the
        discriminator mapping below — the CloudEvent base never changes.
      allOf:
        - $ref: "../common/CAMARA_event_common.yaml#/components/schemas/CloudEvent"
        - type: object
          properties:
            type:
              $ref: "#/components/schemas/ApiEventType"
      discriminator:
        propertyName: type
        mapping:
          org.camaraproject.esim-remote-management.v0.profile-download-completed: "#/components/schemas/ProfileOperationCallback"
          org.camaraproject.esim-remote-management.v0.profile-operation-completed: "#/components/schemas/ProfileOperationCallback"
  responses:

    # ─────────────────────────────────────────────────────────────────────────
    # API-specific error responses (locally defined)
    #
    # Following the Commonalities 0.9.0 catalogue model, responses that match a
    # referenceable catalogue entry are referenced directly from
    # `CAMARA_common.yaml` / `CAMARA_event_common.yaml` (see `paths` above).
    # Only the code combinations the catalogue does not cover are defined
    # locally here — combining `ErrorInfo` with a local restriction of `status`
    # and `code`, and referencing the shared example ingredients so that the
    # error wording stays consistent across CAMARA APIs.
    # ─────────────────────────────────────────────────────────────────────────

    PermissionDenied403:
      description: Forbidden
      headers:
        x-correlator:
          $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../common/CAMARA_common.yaml#/components/schemas/ErrorInfo"
              - type: object
                properties:
                  status:
                    enum:
                      - 403
                  code:
                    enum:
                      - PERMISSION_DENIED
                      - INVALID_TOKEN_CONTEXT
          examples:
            GENERIC_403_PERMISSION_DENIED:
              $ref: "../common/CAMARA_common.yaml#/components/examples/GENERIC_403_PERMISSION_DENIED"
            GENERIC_403_INVALID_TOKEN_CONTEXT:
              description: Reflect some inconsistency between information in some field of the API and the related OAuth2 Token
              value:
                status: 403
                code: INVALID_TOKEN_CONTEXT
                message: Request body is not consistent with access token.

    NotFound404:
      description: Not found
      headers:
        x-correlator:
          $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../common/CAMARA_common.yaml#/components/schemas/ErrorInfo"
              - type: object
                properties:
                  status:
                    enum:
                      - 404
                  code:
                    enum:
                      - NOT_FOUND
                      - IDENTIFIER_NOT_FOUND
          examples:
            GENERIC_404_NOT_FOUND:
              $ref: "../common/CAMARA_common.yaml#/components/examples/GENERIC_404_NOT_FOUND"
            GENERIC_404_IDENTIFIER_NOT_FOUND:
              $ref: "../common/CAMARA_common.yaml#/components/examples/GENERIC_404_IDENTIFIER_NOT_FOUND"

    # 422 for the asynchronous operations that accept `sink`: the identifier
    # codes plus the Commonalities 0.9.0 implicit-subscription code
    # `EVENT_NOTIFICATIONS_NOT_SUPPORTED` (see the `sink` property description).
    ProfileOperationUnprocessableEntity422:
      description: Unprocessable Content
      headers:
        x-correlator:
          $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../common/CAMARA_common.yaml#/components/schemas/ErrorInfo"
              - type: object
                properties:
                  status:
                    enum:
                      - 422
                  code:
                    enum:
                      - SERVICE_NOT_APPLICABLE
                      - MISSING_IDENTIFIER
                      - UNSUPPORTED_IDENTIFIER
                      - UNNECESSARY_IDENTIFIER
                      - EVENT_NOTIFICATIONS_NOT_SUPPORTED
          examples:
            GENERIC_422_SERVICE_NOT_APPLICABLE:
              $ref: "../common/CAMARA_common.yaml#/components/examples/GENERIC_422_SERVICE_NOT_APPLICABLE"
            GENERIC_422_MISSING_IDENTIFIER_DEVICE:
              $ref: "../common/CAMARA_common.yaml#/components/examples/GENERIC_422_MISSING_IDENTIFIER_DEVICE"
            GENERIC_422_UNSUPPORTED_IDENTIFIER_DEVICE:
              $ref: "../common/CAMARA_common.yaml#/components/examples/GENERIC_422_UNSUPPORTED_IDENTIFIER_DEVICE"
            GENERIC_422_UNNECESSARY_IDENTIFIER_DEVICE:
              $ref: "../common/CAMARA_common.yaml#/components/examples/GENERIC_422_UNNECESSARY_IDENTIFIER_DEVICE"
            GENERIC_422_EVENT_NOTIFICATIONS_NOT_SUPPORTED:
              $ref: "../common/CAMARA_event_common.yaml#/components/examples/GENERIC_422_EVENT_NOTIFICATIONS_NOT_SUPPORTED"

    # 429 — extends the catalogue `TooManyRequests429` with the API-specific
    # business quota code `QUOTA_EXCEEDED`.
    TooManyRequests429:
      description: Quota Exceed or Too Many Requests
      headers:
        x-correlator:
          $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../common/CAMARA_common.yaml#/components/schemas/ErrorInfo"
              - type: object
                properties:
                  status:
                    enum:
                      - 429
                  code:
                    enum:
                      - QUOTA_EXCEEDED
                      - TOO_MANY_REQUESTS
          examples:
            GENERIC_429_QUOTA_EXCEEDED:
              $ref: "../common/CAMARA_common.yaml#/components/examples/GENERIC_429_QUOTA_EXCEEDED"
            GENERIC_429_TOO_MANY_REQUESTS:
              $ref: "../common/CAMARA_common.yaml#/components/examples/GENERIC_429_TOO_MANY_REQUESTS"
