        required: true
      responses:
        '201':
          description: OK
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
            Location:
              description: |
                URL of the task resource for retrieving the result of this operation. The URL follows the pattern `/result/query?taskId={taskId}`.
              schema:
                type: string
                format: uri-reference
                maxLength: 2048
          content:
            application/json:
