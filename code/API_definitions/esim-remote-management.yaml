paths:
  /download:
    post:
      security:
        - openId:
            - esim-remote-management:download
      tags:
        - Esim Remote Management
      summary: Download profile
      description: |
        Download and optionally install a new eSIM profile to the device. This is an asynchronous operation that returns a task ID for status tracking.
      parameters:
        - $ref: '#/components/parameters/x-correlator'
      operationId: profileDownload
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaseCmpReqProfileDownloadReq'
        required: true
      responses:
        '201':
          description: OK
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseCmpRespProfileDownloadResp'
        '400':
          $ref: '#/components/responses/Generic400'
        '401':
          $ref: '#/components/responses/Generic401'
        '403':
          $ref: '#/components/responses/Generic403'
        '404':
          $ref: '#/components/responses/Generic404'
        '422':
          $ref: '#/components/responses/Generic422'
      callbacks:
        profile-download-completed:
          '{$request.body/sink}':
            post:
              parameters:
                - $ref: '#/components/parameters/x-correlator'
              requestBody:
                content:
                  application/cloudevents+json:
                    schema:
                      $ref: '#/components/schemas/ProfileOperationCallback'
              responses:
                '204':
                  description: Successful notification
                  headers:
                    x-correlator:
                      $ref: '#/components/headers/x-correlator'
                '400':
                  $ref: '#/components/responses/Generic400'
                '401':
                  $ref: '#/components/responses/Generic401'
                '403':
                  $ref: '#/components/responses/Generic403'
                '410':
                  $ref: '#/components/responses/Generic410'
                '429':
                  $ref: '#/components/responses/Generic429'
              security:
                - {}
                - notificationsBearerAuth: []
  /result/query:
    post:
      security:
        - openId:
            - esim-remote-management:query
      tags:
        - Esim Remote Management
      summary: Query profile operation result
      description: |
        Query the result of an profile operation using the task ID returned from a operation request.
      parameters:
        - $ref: '#/components/parameters/x-correlator'
      operationId: profileResultQuery
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaseCmpReqProfileResultQueryReq'
        required: true
      responses:
        '200':
          description: OK
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseCmpRespProfileResultQueryResp'
        '400':
          $ref: '#/components/responses/Generic400'
        '401':
          $ref: '#/components/responses/Generic401'
        '403':
          $ref: '#/components/responses/Generic403'
        '404':
          $ref: '#/components/responses/Generic404'
        '422':
          $ref: '#/components/responses/Generic422'
  /enable-profile:
    post:
      security:
        - openId:
            - esim-remote-management:enable-profile
      tags:
        - Esim Remote Management
      summary: Enable a profile
      description: |
        Enable an eSIM profile. This is an asynchronous operation that returns a task ID for status tracking.
      parameters:
        - $ref: '#/components/parameters/x-correlator'
      operationId: profileEnable
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaseCmpReqProfileOperReq'
        required: true
      responses:
        '201':
          description: OK
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseCmpRespProfileOperResp'
        '400':
          $ref: '#/components/responses/Generic400'
        '401':
          $ref: '#/components/responses/Generic401'
        '403':
          $ref: '#/components/responses/Generic403'
        '404':
          $ref: '#/components/responses/Generic404'
        '422':
          $ref: '#/components/responses/Generic422'
      callbacks:
        profile-operation-completed:
          '{$request.body/sink}':
            post:
              parameters:
                - $ref: '#/components/parameters/x-correlator'
              requestBody:
                content:
                  application/cloudevents+json:
                    schema:
                      $ref: '#/components/schemas/ProfileOperationCallback'
              responses:
                '204':
                  description: Successful notification
                  headers:
                    x-correlator:
                      $ref: '#/components/headers/x-correlator'
                '400':
                  $ref: '#/components/responses/Generic400'
                '401':
                  $ref: '#/components/responses/Generic401'
                '403':
                  $ref: '#/components/responses/Generic403'
                '410':
                  $ref: '#/components/responses/Generic410'
                '429':
                  $ref: '#/components/responses/Generic429'
              security:
                - {}
                - notificationsBearerAuth: []
  /disable-profile:
    post:
      security:
        - openId:
            - esim-remote-management:disable-profile
      tags:
        - Esim Remote Management
      summary: Disable a profile
      description: |
        Disable an eSIM profile. This is an asynchronous operation that returns a task ID for status tracking.
      parameters:
        - $ref: '#/components/parameters/x-correlator'
      operationId: profileDisable
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaseCmpReqProfileOperReq'
        required: true
      responses:
        '201':
          description: OK
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseCmpRespProfileOperResp'
        '400':
          $ref: '#/components/responses/Generic400'
        '401':
          $ref: '#/components/responses/Generic401'
        '403':
          $ref: '#/components/responses/Generic403'
        '404':
          $ref: '#/components/responses/Generic404'
        '422':
          $ref: '#/components/responses/Generic422'
      callbacks:
        profile-operation-completed:
          '{$request.body/sink}':
            post:
              parameters:
                - $ref: '#/components/parameters/x-correlator'
              requestBody:
                content:
                  application/cloudevents+json:
                    schema:
                      $ref: '#/components/schemas/ProfileOperationCallback'
              responses:
                '204':
                  description: Successful notification
                  headers:
                    x-correlator:
                      $ref: '#/components/headers/x-correlator'
                '400':
                  $ref: '#/components/responses/Generic400'
                '401':
                  $ref: '#/components/responses/Generic401'
                '403':
                  $ref: '#/components/responses/Generic403'
                '410':
                  $ref: '#/components/responses/Generic410'
                '429':
                  $ref: '#/components/responses/Generic429'
              security:
                - {}
                - notificationsBearerAuth: []
  /delete-profile:
    post:
      security:
        - openId:
            - esim-remote-management:delete-profile
      tags:
        - Esim Remote Management
      summary: Delete a profile
      description: |
        Delete an eSIM profile. This is an asynchronous operation that returns a task ID for status tracking.
      parameters:
        - $ref: '#/components/parameters/x-correlator'
      operationId: profileDelete
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaseCmpReqProfileOperReq'
        required: true
      responses:
        '201':
          description: OK
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseCmpRespProfileOperResp'
        '400':
          $ref: '#/components/responses/Generic400'
        '401':
          $ref: '#/components/responses/Generic401'
        '403':
          $ref: '#/components/responses/Generic403'
        '404':
          $ref: '#/components/responses/Generic404'
        '422':
          $ref: '#/components/responses/Generic422'
      callbacks:
        profile-operation-completed:
          '{$request.body/sink}':
            post:
              parameters:
                - $ref: '#/components/parameters/x-correlator'
              requestBody:
                content:
                  application/cloudevents+json:
                    schema:
                      $ref: '#/components/schemas/ProfileOperationCallback'
              responses:
                '204':
                  description: Successful notification
                  headers:
                    x-correlator:
                      $ref: '#/components/headers/x-correlator'
                '400':
                  $ref: '#/components/responses/Generic400'
                '401':
                  $ref: '#/components/responses/Generic401'
                '403':
                  $ref: '#/components/responses/Generic403'
                '410':
                  $ref: '#/components/responses/Generic410'
                '429':
                  $ref: '#/components/responses/Generic429'
              security:
                - {}
                - notificationsBearerAuth: []
components:
  securitySchemes:
    openId:
      description: OpenID Connect authentication
      type: openIdConnect
      openIdConnectUrl: https://example.com/.well-known/openid-configuration
    notificationsBearerAuth:
      description: Bearer authentication for notifications
      type: http
      scheme: bearer
      bearerFormat: '{$request.body#sinkCredential.credentialType}'
  parameters:
    x-correlator:
      name: x-correlator
      in: header
      description: Correlation id for the different services
      schema:
        $ref: '#/components/schemas/XCorrelator'
  headers:
    x-correlator:
      description: Correlation id for the different services
      schema:
        $ref: '#/components/schemas/XCorrelator'
  schemas:
    BaseCmpReqProfileResultQueryReq:
      type: object
      description: Request body for querying profile operation result
      required:
        - taskId
      properties:
        taskId:
          $ref: '#/components/schemas/ProfileOpertaskid'
        device:
          $ref: '#/components/schemas/ProfileOperDevice'
    BaseCmpRespProfileResultQueryResp:
      type: object
      description: Callback payload for profile operation completion notification
      properties:
        taskId:
          type: string
          pattern: ^[a-zA-Z0-9\-]{1,64}$
          maxLength: 64
          description: Task identifier
        eId:
          type: string
          pattern: ^[a-zA-Z0-9\-]{1,64}$
          maxLength: 64
          description: Device EID (eUICC Identifier)
        imei:
          type: string
          pattern: ^[0-9]{15}$
          maxLength: 32
          description: Device IMEI number
        iccid:
          type: string
          pattern: ^[0-9]{19,20}$
          maxLength: 32
          description: Card ICCID number
        operResult:
          type: string
          description: Operation profile result
          enum:
            - SUCCESS
            - ERROR
    BaseCmpReqProfileOperReq:
      type: object
      description: Request body for profile operation
      required:
        - device
      properties:
        device:
          $ref: '#/components/schemas/ProfileOperDevice'
        sink:
          type: string
          format: uri
          maxLength: 2048
          description: The URL where the API response will be asynchronously delivered, using the HTTP protocol.
          example: https://endpoint.example.com/sink
        sinkCredential:
          description: A sink credential provides authentication or authorization information necessary to enable delivery of events to a target.
          allOf:
            - $ref: '#/components/schemas/SinkCredential'
    BaseCmpRespProfileOperResp:
      type: object
      description: Response body for profile operation
      properties:
        taskId:
          $ref: '#/components/schemas/ProfileOpertaskid'
        device:
          $ref: '#/components/schemas/ProfileOperDevice'
        status:
          $ref: '#/components/schemas/ProfileOperStatus'
        statusInfo:
          $ref: '#/components/schemas/ProfileOperStatusInfo'
    ProfileOpertaskid:
      type: string
      pattern: ^[a-zA-Z0-9\-]{1,64}$
      maxLength: 64
      description: The task number returned after the operation is completed
    ProfileOperDevice:
      type: object
      description: Configuration for profile operation response
      properties:
        eId:
          type: string
          pattern: ^[a-zA-Z0-9\-]{1,64}$
          maxLength: 64
          description: Device EID
        imei:
          type: string
          pattern: ^[0-9]{15}$
          maxLength: 32
          description: Device IMEI number
        iccid:
          type: string
          pattern: ^[0-9]{19,20}$
          maxLength: 32
          description: Card ICCID number
    ProfileOperStatus:
      description: |
        Status of the profile operation
        * `SUCCESS` - The eSIM configuration file was successfully enabled
        * `ERROR` - Failed to enable the eSIM configuration file
      type: string
      enum:
        - SUCCESS
        - ERROR
    ProfileOperStatusInfo:
      description: |
        Additional information about the profile operation status
        * `OPERATION_COMPLETED` - The assignment operation has been completed
        * `ICCID_NOT_FOUND` - The specified iccid does not exist
        * `OPERATION_UNKNOWN_ERROR` - The operation failed due to an unknown error
        * `OPERATION_PENDING` - The operation request is pending for validation and verification
      type: string
      enum:
        - OPERATION_COMPLETED
        - ICCID_NOT_FOUND
        - OPERATION_UNKNOWN_ERROR
        - OPERATION_PENDING
    BaseCmpReqProfileDownloadReq:
      type: object
      description: Request body for profile operation
      required:
        - device
      properties:
        device:
          $ref: '#/components/schemas/ProfileOperDevice'
        sink:
          type: string
          format: uri
          maxLength: 2048
          description: The URL where the API response will be asynchronously delivered, using the HTTP protocol.
          example: https://endpoint.example.com/sink
        sinkCredential:
          description: A sink credential provides authentication or authorization information necessary to enable delivery of events to a target.
          allOf:
            - $ref: '#/components/schemas/SinkCredential'
    BaseCmpRespProfileDownloadResp:
      type: object
      description: Response body for profile operation
      properties:
        taskId:
          $ref: '#/components/schemas/ProfileOpertaskid'
        device:
          $ref: '#/components/schemas/ProfileOperDevice'
        status:
          $ref: '#/components/schemas/ProfileOperStatus'
        statusInfo:
          $ref: '#/components/schemas/ProfileOperStatusInfo'
    ProfileOperationCallback:
      description: Callback payload for profile operation completion notification
      allOf:
        - $ref: '#/components/schemas/ApiNotificationEvent'
        - type: object
          properties:
            data:
              type: object
              description: Event details
              properties:
                taskId:
                  type: string
                  pattern: ^[a-zA-Z0-9\-]{1,64}$
                  maxLength: 64
                  description: Task identifier
                eId:
                  type: string
                  pattern: ^[a-zA-Z0-9\-]{1,64}$
                  maxLength: 64
                  description: Device EID (eUICC Identifier)
                imei:
                  type: string
                  pattern: ^[0-9]{15}$
                  maxLength: 32
                  description: Device IMEI number
                iccid:
                  type: string
                  pattern: ^[0-9]{19,20}$
                  maxLength: 32
                  description: Card ICCID number
                operResult:
                  type: string
                  description: Operation profile result
                  enum:
                    - SUCCESS
                    - ERROR
              required:
                - taskId
    XCorrelator:
      description: Value for the x-correlator
      type: string
      pattern: ^[a-zA-Z0-9-_:;.\/<>{}]{0,256}$
      maxLength: 256
      example: b4333c46-49c0-4f62-80d7-f0ef930f1c46
    ApiEventType:
      type: string
      description: |
        Enum of API-specific event type strings for this API project.
        The reverse-DNS prefix `org.camaraproject.<api-name>` makes each value
        globally unique, so two different API groups can independently define
        identically-named event types without any collision risk.
      enum:
        - org.camaraproject.esim-remote-management.v0.profile-download-completed
        - org.camaraproject.esim-remote-management.v0.profile-operation-completed
    ApiNotificationEvent:
      description: |
        API-specific notification event group.
        Extends the CloudEvent envelope and constrains `type` to the set of
        event types defined by this API project.
        Adding a new event type only requires updating ApiEventType and the
        discriminator mapping below — the CloudEvent base never changes.
      allOf:
        - $ref: '#/components/schemas/CloudEvent'
        - type: object
          properties:
            type:
              $ref: '#/components/schemas/ApiEventType'
      discriminator:
        propertyName: type
        mapping:
          org.camaraproject.esim-remote-management.v0.profile-download-completed: '#/components/schemas/ProfileOperationCallback'
          org.camaraproject.esim-remote-management.v0.profile-operation-completed: '#/components/schemas/ProfileOperationCallback'
    SinkCredential:
      description: A sink credential provides authentication or authorization information necessary to enable delivery of events to a target.
      type: object
      properties:
        credentialType:
          type: string
          enum:
            - ACCESSTOKEN
            - PRIVATE_KEY_JWT
          description: |
            The type of the credential - MUST be set to ACCESSTOKEN or PRIVATE_KEY_JWT for now
      discriminator:
        propertyName: credentialType
        mapping:
          ACCESSTOKEN: '#/components/schemas/AccessTokenCredential'
          PRIVATE_KEY_JWT: '#/components/schemas/PrivateKeyJWTCredential'
      required:
        - credentialType
    AccessTokenCredential:
      type: object
      description: An access token credential. This type of credential is meant to be used by API Consumers that have limited capabilities to handle authorization requests.
      allOf:
        - $ref: '#/components/schemas/SinkCredential'
        - type: object
          properties:
            accessToken:
              description: REQUIRED. An access token is a token granting access to the target resource.
              type: string
              maxLength: 4096
              writeOnly: true
            accessTokenExpiresUtc:
              type: string
              format: date-time
              maxLength: 64
              description: |
                REQUIRED. An absolute (UTC) timestamp at which the token shall be considered expired.
                In the case of an ACCESS_TOKEN_EXPIRED termination reason, implementation should notify the client before the expiration date.
                If the access token is a JWT and registered "exp" (Expiration Time) claim is present, the two expiry times should match.
                It must follow [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) and must have time zone.
              example: '2023-07-03T12:27:08.312Z'
            accessTokenType:
              description: REQUIRED. Type of the access token (See [OAuth 2.0](https://tools.ietf.org/html/rfc6749#section-7.1)).
              type: string
              writeOnly: true
              enum:
                - bearer
          required:
            - accessToken
            - accessTokenExpiresUtc
            - accessTokenType
    PrivateKeyJWTCredential:
      type: object
      description: Use PRIVATE_KEY_JWT to get an access token. This type of credential is to be used by clients that have an authorization server.
      allOf:
        - $ref: '#/components/schemas/SinkCredential'
        - type: object
          properties:
            clientId:
              description: The client ID used to authenticate when requesting an access token using PRIVATE_KEY_JWT.
              type: string
              maxLength: 128
              writeOnly: true
            tokenUri:
              description: The URI where to request an access token using PRIVATE_KEY_JWT.
              type: string
              format: uri
              maxLength: 2048
              pattern: ^https:\/\/.+$
              writeOnly: true
            jwksUri:
              description: The URI used to request the public key to verify that the JWT assertion was signed by PRIVATE_KEY_JWT.
              type: string
              format: uri
              maxLength: 2048
              pattern: ^https:\/\/.+$
              readOnly: true
    ErrorInfo:
      type: object
      description: A structured error response providing details about a failed request, including the HTTP status code, an error code, and a human-readable message
      required:
        - status
        - code
        - message
      properties:
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: HTTP response status code
        code:
          type: string
          maxLength: 96
          description: A human-readable code to describe the error
        message:
          type: string
          maxLength: 512
          description: A human-readable description of what the event represents
    Source:
      type: string
      format: uri-reference
      minLength: 1
      maxLength: 2048
      description: |
        Identifies the context in which an event happened - be a non-empty `URI-reference` like:
        - URI with a DNS authority:
          * https://github.com/cloudevents
          * mailto:cncf-wg-serverless@lists.cncf.io
        - Universally-unique URN with a UUID:
          * urn:uuid:6e8bc430-9c3a-11d9-9669-0800200c9a66
        - Application-specific identifier:
          * /cloudevents/spec/pull/123
          * 1-555-123-4567
      example: https://notificationSendServer12.example.com
    DateTime:
      type: string
      format: date-time
      maxLength: 64
      description: Timestamp. It must follow [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) and must have time zone.
      example: '2018-04-05T17:31:00Z'
    CloudEvent:
      type: object
      description: |
        CloudEvents 1.0 specification envelope.
        This schema is the stable base for all CAMARA event notifications.
        It imposes no constraints on `type` values or `data` structure —
        those concerns belong to the API-specific and lifecycle group schemas.
      required:
        - id
        - source
        - specversion
        - type
        - time
      properties:
        id:
          type: string
          maxLength: 256
          description: Identifier of this event, unique within the source context.
        source:
          $ref: '#/components/schemas/Source'
        type:
          type: string
          maxLength: 512
          description: |
            Identifies the event type. CAMARA APIs use reverse-DNS notation:
            `org.camaraproject.<api-name>.<event-version>.<event-name>`
            The api-name segment makes each type globally unique across API groups.
        specversion:
          type: string
          description: Version of the specification to which this event conforms (must be 1.0 if it conforms to cloudevents 1.0.2 version)
          enum:
            - '1.0'
        datacontenttype:
          type: string
          description: media-type that describes the event payload encoding, must be "application/json" for CAMARA APIs
          enum:
            - application/json
        data:
          type: object
          description: Event details payload. Structure is defined by each concrete event schema.
        time:
          $ref: '#/components/schemas/DateTime'
  responses:
    Generic400:
      description: Bad Request
      headers:
        x-correlator:
          $ref: '#/components/headers/x-correlator'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorInfo'
              - type: object
                properties:
                  status:
                    enum:
                      - 400
                  code:
                    enum:
                      - INVALID_ARGUMENT
                      - OUT_OF_RANGE
          examples:
            GENERIC_400_INVALID_ARGUMENT:
              description: Invalid Argument. Generic Syntax Exception
              value:
                status: 400
                code: INVALID_ARGUMENT
                message: Client specified an invalid argument, request body or query param.
            GENERIC_400_OUT_OF_RANGE:
              description: Out of Range. Specific Syntax Exception used when a given field has a pre-defined range or a invalid filter criteria combination is requested
              value:
                status: 400
                code: OUT_OF_RANGE
                message: Client specified an invalid range.
    Generic401:
      description: Unauthorized
      headers:
        x-correlator:
          $ref: '#/components/headers/x-correlator'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorInfo'
              - type: object
                properties:
                  status:
                    enum:
                      - 401
                  code:
                    enum:
                      - UNAUTHENTICATED
          examples:
            GENERIC_401_UNAUTHENTICATED:
              description: Request cannot be authenticated and a new authentication is required
              value:
                status: 401
                code: UNAUTHENTICATED
                message: Request not authenticated due to missing, invalid, or expired credentials. A new authentication is required.
    Generic403:
      description: Forbidden
      headers:
        x-correlator:
          $ref: '#/components/headers/x-correlator'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorInfo'
              - type: object
                properties:
                  status:
                    enum:
                      - 403
                  code:
                    enum:
                      - PERMISSION_DENIED
                      - INVALID_TOKEN_CONTEXT
          examples:
            GENERIC_403_PERMISSION_DENIED:
              description: Permission denied. OAuth2 token access does not have the required scope or when the user fails operational security
              value:
                status: 403
                code: PERMISSION_DENIED
                message: Client does not have sufficient permissions to perform this action.
            GENERIC_403_INVALID_TOKEN_CONTEXT:
              description: Reflect some inconsistency between information in some field of the API and the related OAuth2 Token
              value:
                status: 403
                code: INVALID_TOKEN_CONTEXT
                message: Request body is not consistent with access token.
    Generic404:
      description: Not found
      headers:
        x-correlator:
          $ref: '#/components/headers/x-correlator'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorInfo'
              - type: object
                properties:
                  status:
                    enum:
                      - 404
                  code:
                    enum:
                      - NOT_FOUND
                      - IDENTIFIER_NOT_FOUND
          examples:
            GENERIC_404_NOT_FOUND:
              description: Resource is not found
              value:
                status: 404
                code: NOT_FOUND
                message: The specified resource is not found.
            GENERIC_404_IDENTIFIER_NOT_FOUND:
              description: Some identifier cannot be matched to a device
              value:
                status: 404
                code: IDENTIFIER_NOT_FOUND
                message: Device identifier not found.
    Generic410:
      description: Gone
      headers:
        x-correlator:
          $ref: '#/components/headers/x-correlator'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorInfo'
              - type: object
                properties:
                  status:
                    enum:
                      - 410
                  code:
                    enum:
                      - GONE
          examples:
            GENERIC_410_GONE:
              description: Use in notifications flow to allow API Consumer to indicate that its callback is no longer available
              value:
                status: 410
                code: GONE
                message: Access to the target resource is no longer available.
    Generic429:
      description: Quota Exceed or Too Many Requests
      headers:
        x-correlator:
          $ref: '#/components/headers/x-correlator'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorInfo'
              - type: object
                properties:
                  status:
                    enum:
                      - 429
                  code:
                    enum:
                      - QUOTA_EXCEEDED
                      - TOO_MANY_REQUESTS
          examples:
            GENERIC_429_QUOTA_EXCEEDED:
              description: Request is rejected due to exceeding a business quota limit
              value:
                status: 429
                code: QUOTA_EXCEEDED
                message: Out of resource quota.
            GENERIC_429_TOO_MANY_REQUESTS:
              description: Access to the API has been temporarily blocked due to rate or spike arrest limits being reached
              value:
                status: 429
                code: TOO_MANY_REQUESTS
                message: Rate limit reached.
    Generic422:
      description: Unprocessable Content
      headers:
        x-correlator:
          $ref: '#/components/headers/x-correlator'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorInfo'
              - type: object
                properties:
                  status:
                    enum:
                      - 422
                  code:
                    enum:
                      - SERVICE_NOT_APPLICABLE
                      - MISSING_IDENTIFIER
                      - UNSUPPORTED_IDENTIFIER
                      - UNNECESSARY_IDENTIFIER
          examples:
            GENERIC_422_SERVICE_NOT_APPLICABLE:
              description: Service not applicable for the provided identifier
              value:
                status: 422
                code: SERVICE_NOT_APPLICABLE
                message: The service is not available for the provided identifier.
            GENERIC_422_MISSING_IDENTIFIER:
              description: An identifier is not included in the request and the device or phone number identification cannot be derived from the 3-legged access token
              value:
                status: 422
                code: MISSING_IDENTIFIER
                message: The device cannot be identified.
            GENERIC_422_UNSUPPORTED_IDENTIFIER:
              description: None of the provided identifiers is supported by the implementation
              value:
                status: 422
                code: UNSUPPORTED_IDENTIFIER
                message: The identifier provided is not supported.
            GENERIC_422_UNNECESSARY_IDENTIFIER:
              description: An explicit identifier is provided when a device or phone number has already been identified from the access token
              value:
                status: 422
                code: UNNECESSARY_IDENTIFIER
                message: The device is already identified by the access token.
