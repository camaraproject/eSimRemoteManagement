      parameters:
        - $ref: '#/components/parameters/x-correlator'
      operationId: profileDisable
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileOperationRequest'
        required: true
      responses:
        '201':
          description: OK
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
            Location:
              description: |
                URL of the task resource for retrieving the result of this operation. The URL follows the pattern `/result/query?taskId={taskId}`.
              schema:
                type: string
                format: uri-reference
                maxLength: 2048
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileOperationResult'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthenticated401'
        '403':
          $ref: '#/components/responses/PermissionDenied403'
        '404':
          $ref: '#/components/responses/IdentifierNotFound404'
        '422':
          $ref: '#/components/responses/UnprocessableEntity422'
        '429':
          $ref: '#/components/responses/TooManyRequests429'
      callbacks:
        profile-operation-completed:
          '{$request.body#/sink}':
            post:
              parameters:
                - $ref: '#/components/parameters/x-correlator'
              requestBody:
                content:
                  application/cloudevents+json:
                    schema:
                      $ref: '#/components/schemas/ProfileOperationCallback'
              responses:
                '204':
                  description: Successful notification
                  headers:
                    x-correlator:
                      $ref: '#/components/headers/x-correlator'
                '400':
                  $ref: '#/components/responses/BadRequest400'
                '401':
                  $ref: '#/components/responses/Unauthenticated401'
                '403':
                  $ref: '#/components/responses/PermissionDenied403'
                '410':
                  $ref: '#/components/responses/SinkGone410'
                '429':
                  $ref: '#/components/responses/TooManyRequests429'
              security:
                - {}
                - notificationsBearerAuth: []
  /delete-profile:
    post:
      security:
        - openId:
            - esim-remote-management:delete-profile
      tags:
        - Esim Remote Management
      summary: Delete a profile
      description: |
        Delete an eSIM profile. This is an asynchronous operation that returns a task ID for status tracking.

        If the optional `sink` is provided in the request body, the API provider
        notifies the API consumer of the operation outcome via that sink;
        otherwise the outcome is retrieved with `/result/query`.
      parameters:
        - $ref: '#/components/parameters/x-correlator'
      operationId: profileDelete
      requestBody:
        content:
          application/json:
            schema:
